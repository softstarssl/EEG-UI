app:
  title: "NeuroRegen AI"
  host: "127.0.0.1"
  port: 7860
  share: false

inference:
  backend: "real_reve"
  threshold: 0.5
  device: "auto"

files:
  allowed_extensions:
    - ".edf"
    - ".set"
    - ".fif"
    - ".mat"
    - ".npy"
    - ".npz"
  max_size_mb: 1024

reve:
  # ---- 真实 REVE 模型配置 ----
  # 将 inference.backend 改为 "real_reve" 后生效
  model_id: "brain-bzh/reve-base"
  depression_checkpoint: "E:/Desktop/eeg/outputs/checkpoints/exp_TDBRAIN_depression/best_model.pt"
  adhd_checkpoint: "E:/Desktop/eeg/outputs/checkpoints/exp_TDBRAIN_adhd/best_model.pt"

  # ---- 预处理参数（需与训练时一致） ----
  target_sampling_rate: 200
  bandpass_low_hz: 0.5
  bandpass_high_hz: 99.5
  zscore: true
  clip_std: 15.0
  window_seconds: 10
  window_overlap_seconds: 0
  patch_seconds: 1

  # ---- 模型输入规格 ----
  n_times: 2000
  sfreq: 200.0
  input_window_seconds: 10.0
  use_attention_pooling: true
